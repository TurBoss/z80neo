# z80neo boot configuration (KEY=VALUE, order-independent, '#' = comment)
MACHINE=Z80
CANCEL2=FFF
CANCEL=BFF
OK=7FF
BACK=5FF
DOWN=2FF
UP=0FF
PROG1=midiplayer.ihx
PROG2=serial_echo.hex
PROG3=serial_rx.hex
PROG4=serial_tx.hex
DEBUG=0
FUZIX=0
BAUD=115200
UART1_BAUD=115200
UART1_FORMAT=8N1
# MIDI player Z80 overhead calibration, tenths of a ms (raise = play faster)
MIDI_GROUP_X10=30
MIDI_BYTE_X10=12
