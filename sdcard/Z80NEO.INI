# z80neo boot configuration (KEY=VALUE, order-independent, '#' = comment)
MACHINE=Z80
CANCEL2=FFF
CANCEL=BFF
OK=7FF
BACK=5FF
DOWN=2FF
UP=0FF
PROG1=cpmz80neo.hex
PROG2=serial_echo.hex
PROG3=serial_rx.hex
PROG4=serial_tx.hex
DEBUG=0
FUZIX=0
BAUD=115200
UART1_BAUD=115200
UART1_FORMAT=8N1
# Z80 clock (kHz) and HIGH-time duty (%).  Default 128 kHz / 50%.  The NMOS
# Z0840004 samples WAIT relative to the clock.  160 was tested and derailed
# (looping/corrupt MIDI stream); 128 is the validated value on this board.
Z80_KHZ=128
Z80_DUTY=50
# MIDI player optional speed trim, tenths of a ms (raise = play faster; 0 = off).
# The firmware schedules against the real clock, so these normally stay 0.
# MIDI_GROUP_X10=0
# MIDI_BYTE_X10=0
# MIDI player console channel monitor (16 rows, one per channel, current note).
# Set to 0/OFF for a raw (non-VT102) terminal, or to hide the panel.
MIDI_PANEL=1
# OLED screensaver: enable/disable, which demo, and the idle delay in seconds.
# Demos: Puzzle, Snake, Starfield, Life, Bounce.  Also settable live from the
# firmware menu (Screensaver page); these keys only set the boot defaults.
SCREENSAVER=1
SS_MODE=Puzzle
SS_IDLE=30
